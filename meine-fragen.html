<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meine Fragen · 德语问题学习库</title><style>:root{--bg:#f6f2ec;--paper:#fffdf9;--line:#e8e0d7;--ink:#2f3138;--muted:#7a7d87;--blue:#5f7694}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 system-ui,"Segoe UI",sans-serif}.wrap{max-width:970px;margin:auto;padding:30px 18px 70px}a{color:var(--blue)}h1{margin:6px 0}p{color:var(--muted)}.bar,.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.stat,.card{border:1px solid var(--line);border-radius:17px;background:var(--paper);padding:17px;margin:12px 0}.stat{flex:1;min-width:130px}.stat b{font-size:23px}.stat small{display:block;color:var(--muted)}button,select,input,textarea{font:inherit;border:1px solid #cfd9e4;border-radius:9px;padding:9px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#627f9f;color:white}input,textarea{width:100%}textarea{min-height:72px;resize:vertical}.muted{color:var(--muted);font-size:13px}.tag{color:#5f7694;font-size:12px;font-weight:800}.bad{color:#ad4f55}.good{color:#347b60}details{margin:12px 0;border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:#f9f9f8}summary{cursor:pointer;font-weight:700}.practice{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-top:9px}.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}#list{margin-top:15px}.focus:target{outline:3px solid #90aac7}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="article-learning.html">← Thema AI 文章主页</a><h1>Meine Fragen · 我的语法问题库</h1><p>记录实际问过、没有弄懂或练习时发现的问题。每个知识点都有独立学习卡、反思区、练习次数和熟练次数。练习后手动记录结果，系统不会仅凭查看答案就判定已掌握。</p><div class="bar" id="stats"></div><div class="card"><div class="head"><b>开始今天的学习</b><button onclick="backup()">导出学习记录 JSON</button></div><p class="muted">建议优先打开「学习中」「待继续」。你也可以创建新问题；进度仅保存在当前设备的浏览器里，导出文件可备份。</p><div class="grid"><div><label>筛选状态</label><select id="filter"><option value="all">全部问题</option><option value="learning">学习中 / 待复习</option><option value="paused">待继续</option><option value="mastered">已掌握</option></select></div><div><label>查找知识点</label><input id="search" placeholder="例如 Partizip、Dativ、anstatt"></div></div></div><div id="list"></div><div class="card"><h2>＋ 新增我发现的问题</h2><label>问题标题</label><input id="newtitle" placeholder="例如：为什么是 diesem？"><label>我的困惑 / 原句</label><textarea id="newquestion" placeholder="写下今天没有完全理解的地方，下一次打开还能继续"></textarea><button class="primary" onclick="addTopic()">保存为新问题</button></div></main><script>
const seed=[["Adjektivdeklination","形容词词尾变化","die arbeitenden Mitarbeiter / ein trainiertes KI-System","先判断冠词、性别、格与单复数，再选择 -e / -en / -es。","die arbeitende Mitarbeiter → die arbeitenden Mitarbeiter","正在工作的员工（复数）","die arbeitenden Mitarbeiter"],["Partizip I & II","第一分词与第二分词","ein lernendes System / die analysierten Daten","I：动词原形+d，常表示主动进行；II：过去分词，及物动词的定语常表示受作用。定语需变化词尾。","die analysterte Daten → die analysierten Daten","不断上涨的价格","die steigenden Preise"],["Reflexive Verben","反身动词与 Partizip I","sich entwickeln → die sich entwickelnde KI","sich entwickeln 是自己发展；entwickeln 可表示开发某物。构成定语时保留 sich。","KI hat immer schneller entwickelt → Die KI entwickelt sich immer schneller.","一个正在不断发展的市场","ein sich ständig weiterentwickelnder Markt"],["Kasus & Präpositionen","介词与格：an / durch / über / von / auf","an dieser Universität / durch die Analyse der Daten","an 表地点/目标时：Wo+Dativ、Wohin+Akkusativ；固定动词搭配另记。durch/über + Akk；von + Dat；Analyse der Daten 中 der Daten 是 Genitiv。","Wir sprechen über den steigenden Kosten → Wir sprechen über die steigenden Kosten.","我们讨论 AI 对工作世界的影响。","Wir sprechen über die Auswirkungen von KI auf die Arbeitswelt."],["Verbkonjugation","动词变位与主谓一致","KI wird / die Daten sind / Probleme lassen sich lösen","单数第三人称 wird, ist, lässt；复数 werden, sind, lassen。","die gesammelten Daten ist → Die gesammelten Daten sind.","这些收集的数据非常重要。","Die gesammelten Daten sind sehr wichtig."],["anstatt ... zu","anstatt / statt + zu-Infinitiv","Anstatt zu warten, sollten wir handeln.","表示与其 A 不如 B；anstatt + zu-Infinitiv，主句动词保持第二位。","需要理解 anstatt 的意义和位置","与其抱怨，我们应该寻找解决方案。","Anstatt uns zu beschweren, sollten wir Lösungen finden."],["sich lassen","sich lassen + Infinitiv 的可能性表达","Das Problem lässt sich lösen.","表示可以被解决；意思接近 kann gelöst werden。主语单复数决定 lässt / lassen。","需要理解 lässt sich lösen 结构","这些问题可以解决。","Die Probleme lassen sich lösen."],["Vergleichsformen","immer + 比较级","Die KI wird immer wichtiger.","immer 单独是总是；immer + Komparativ 表示越来越……。","KI werden immer wichtiger → KI wird immer wichtiger.","生活变得越来越贵。","Das Leben wird immer teurer."],["Partizip II Bildung","第二分词构成与拼写","analysieren → analysiert / trainieren → trainiert","-ieren 结尾动词的 Partizip II 不加 ge-；定语修饰时仍要加词尾。","trainerierte KI → trainierte KI","已经分析过的数据","die analysierten Daten"],["Genitiv","第二格：名词所属关系","die Analyse der Daten","durch 决定 Analyse 为 Akkusativ，但 Daten 是依赖名词 Analyse 的 Genitiv（复数 der）。","不知道 der Daten 为什么是 der","通过对数据的分析","durch die Analyse der Daten"]];const key='deutsch-ai-learning-questions-v1';let db;try{db=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}if(!db||!Array.isArray(db.items))db={items:seed.map((x,i)=>({id:'seed'+i,title:x[0],zh:x[1],example:x[2],lesson:x[3],mistake:x[4],question:x[5],answer:x[6],attempts:0,successes:0,status:'learning',reflection:'',draft:'',history:[]}))};function save(){localStorage.setItem(key,JSON.stringify(db))}function escapeHtml(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function item(id){return db.items.find(x=>x.id===id)}function setField(id,k,val){let t=item(id);if(t){t[k]=val;save()}}function render(){let f=document.getElementById('filter').value,q=document.getElementById('search').value.toLowerCase();let mastered=db.items.filter(x=>x.status==='mastered').length;document.getElementById('stats').innerHTML='<div class="stat"><b>'+db.items.length+'</b><small>问题总数</small></div><div class="stat"><b>'+db.items.filter(x=>x.status==='paused').length+'</b><small>待继续</small></div><div class="stat"><b>'+mastered+'</b><small>已掌握</small></div><div class="stat"><b>'+db.items.reduce((a,x)=>a+x.attempts,0)+'</b><small>累计练习次数</small></div>';document.getElementById('list').innerHTML=db.items.filter(x=>(f==='all'||(f==='learning'?x.status!=='mastered':x.status===f))&&[x.title,x.zh,x.lesson,x.reflection].join(' ').toLowerCase().includes(q)).map(x=>'<section class="card focus" id="'+x.id+'"><div class="head"><div><div class="tag">MEINE FRAGEN · '+escapeHtml(x.zh||'个人问题')+'</div><h2 style="margin:4px 0">'+escapeHtml(x.title)+'</h2></div><select aria-label="学习状态" onchange="setField(\''+x.id+'\',\'status\',this.value);render()"><option value="learning" '+(x.status==='learning'?'selected':'')+'>学习中</option><option value="paused" '+(x.status==='paused'?'selected':'')+'>待继续</option><option value="mastered" '+(x.status==='mastered'?'selected':'')+'>已掌握</option></select></div><div class="muted">练习 '+x.attempts+' 次 · 熟练 '+x.successes+' 次'+(x.history.length?' · 最近练习 '+escapeHtml(x.history[x.history.length-1].date):'')+'</div><details><summary>我的困惑 → 语法解释 → 需要学什么</summary><p><b>遇到的问题：</b>'+escapeHtml(x.mistake)+'</p><p><b>核心规则：</b>'+escapeHtml(x.lesson)+'</p><p><b>参考结构：</b>'+escapeHtml(x.example)+'</p></details><div class="practice"><b>再练一次：</b> '+escapeHtml(x.question)+'<label>自己写下答案</label><textarea oninput="setField(\''+x.id+'\',\'draft\',this.value)">'+escapeHtml(x.draft)+'</textarea><details><summary>查看参考答案（先自己回答）</summary><div class="good">'+escapeHtml(x.answer||'这个问题还没有标准答案，可先记录疑问和反思。')+'</div></details><div class="actions"><button onclick="record(\''+x.id+'\',false)">记录一次练习 · 仍需巩固</button><button class="primary" onclick="record(\''+x.id+'\',true)">记录一次练习 · 独立答对</button></div><label>我的反思：为什么错了？下一次该练什么？</label><textarea placeholder="例如：我仍然分不清复数 Akkusativ 的冠词。明天练 3 道。" oninput="setField(\''+x.id+'\',\'reflection\',this.value)">'+escapeHtml(x.reflection)+'</textarea></div></section>').join('')||'<div class="card">暂无符合条件的知识点。</div>'}function record(id,ok){let x=item(id);x.attempts++;if(ok)x.successes++;x.history.push({date:new Date().toLocaleDateString('zh-CN'),ok});if(!ok)x.status='paused';save();render()}function addTopic(){let title=document.getElementById('newtitle').value.trim(),note=document.getElementById('newquestion').value.trim();if(!title){alert('请先写标题');return}db.items.unshift({id:'custom'+Date.now(),title,zh:'自己记录',example:'',lesson:'请在这里继续学习并补充规则。',mistake:note,question:'请用自己的话解释这个知识点，并尝试造句。',answer:'',attempts:0,successes:0,status:'paused',reflection:note,draft:'',history:[]});save();document.getElementById('newtitle').value='';document.getElementById('newquestion').value='';document.getElementById('filter').value='all';document.getElementById('search').value='';render();document.getElementById(db.items[0].id)?.scrollIntoView({behavior:'smooth',block:'center'});alert('问题已保存到本地；登录后请确认顶部云端同步提示。')}function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='meine-fragen-backup.json';a.click();URL.revokeObjectURL(url)}document.getElementById('filter').onchange=render;document.getElementById('search').oninput=render;render();if(location.hash){setTimeout(()=>document.getElementById(location.hash.slice(1))?.scrollIntoView(),100)}
</script><script src="deutsch-cloud-sync.js" defer></script></body></html>
