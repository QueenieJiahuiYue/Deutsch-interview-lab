<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thema AI · Fehlerbuch</title><style>
:root{--bg:#f6f2ec;--paper:#fffdf9;--ink:#2f3138;--muted:#7a7d87;--line:#e8e0d7;--accent:#5f7694}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Segoe UI",system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:30px 20px 60px}h1{margin:0;font-size:30px}p{margin:6px 0 18px;color:var(--muted)}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.back{color:var(--accent)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{cursor:pointer;background:#fff;border:1px solid #d6dfe9;color:#455a78;border-radius:10px;padding:9px 13px;font:inherit}button.selected{background:#e3edf8;border-color:#92a9c4}.card{border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:19px 22px;margin:14px 0;box-shadow:0 8px 20px #453e3610}.card h2{font-size:19px;margin:3px 0 11px}.tag{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.07em}.row{margin:10px 0}.label{font-size:12px;color:var(--muted);font-weight:700}.wrong{color:#ad4851}.correct{color:#2f785d}.answer{display:none;background:#edf4f9;padding:12px;border-radius:10px;margin-top:9px}.answer.visible{display:block}textarea{width:100%;min-height:66px;font:inherit;padding:10px;border:1px solid #d5dce6;border-radius:9px;resize:vertical;background:white}.bottom{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.count{color:#536a86;font-size:14px;margin:5px 0 15px}.tip{background:#eef4f9;border:1px solid #cfdde9;border-radius:12px;padding:12px 15px;margin:18px 0}@media(max-width:650px){.wrap{padding:22px 14px}.card{padding:16px}h1{font-size:25px}}</style></head><body><main class="wrap"><div class="top"><div><div class="tag">THEMA AI · ACTIVE RECALL</div><h1>Fehlerbuch · 我的错题本</h1></div><a class="back" href="article-learning.html">← 返回文章主页</a></div><p>把每次真实犯错的地方变成可重复的专项训练。先自己重新造句，再查看答案。</p><div class="tip"><b>建议练习方式：</b> 每天先练「待复习」，隔天换一个语境再练；连续两次能独立说对后，标为「已掌握」。进度与输入保存在当前浏览器中。</div><div class="toolbar"><button data-filter="all" class="selected">全部</button><button data-filter="todo">待复习</button><button data-filter="done">已掌握</button></div><div id="counter" class="count"></div><div id="cards"></div></main><script>
const items=[["反身动词","KI hat immer schneller entwickelt.","Die KI entwickelt sich immer schneller.","sich entwickeln 表示自身发展；entwickeln + Akk. 表示开发某物。","sich entwickeln 的现在时变位及 Perfekt: hat sich entwickelt。","人工智能发展得越来越快。","Die KI entwickelt sich immer schneller."],["werden 动词变位","KI werden immer wichtiger.","KI wird immer wichtiger.","KI 是单数，第三人称单数用 wird，不是 werden。","werden: ich werde, du wirst, er/sie/es wird, wir werden；搭配比较级。","人工智能变得越来越重要。","KI wird immer wichtiger."],["介词与格","Wir sprechen über die Auswirkung von AI auf Arbeitplazt.","Wir sprechen über die Auswirkungen von KI auf die Arbeitswelt.","über + Akk.; von + Dat.; auf + Akk.；宏观影响常用 Auswirkungen（复数）。","练习 über etwas sprechen 以及 Auswirkungen von X auf Y；区分 Arbeitsplatz / Arbeitswelt。","我们讨论人工智能对社会的影响。","Wir sprechen über die Auswirkungen von KI auf die Gesellschaft."],["比较级","immer = 越来越","immer + Komparativ = 越来越……","immer 单独意为总是；与比较级搭配才有逐渐变化的意思。","schnell→schneller, wichtig→wichtiger, komplex→komplexer；越来越……用 immer + 比较级。","工作世界正在变得越来越复杂。","Die Arbeitswelt wird immer komplexer."],["拼写与词汇","Die Technology ist sehr beeindruckend.","Die Technologie ist sehr beeindruckend.","Technologie 是德语拼写；beeindruckend 使用正确。","Technologie, Entwicklung, Arbeitsplatz, präzise；结合词性与真实句子记忆。","这项技术的发展令人印象深刻。","Die Entwicklung dieser Technologie ist beeindruckend."],["固定表达","aufgehalten = 不可阻挡","Die Entwicklung der KI ist nicht aufzuhalten.","aufhalten 是阻止；nicht aufzuhalten 才表示不可阻挡。原句中 Entwicklung 还曾拼成 Entwirkelung。","sein + nicht + zu-Infinitiv；区分 aufhalten / nicht aufzuhalten。","技术进步不可阻挡。","Der technologische Fortschritt ist nicht aufzuhalten."]];const key='thema-ai-fehlerbuch-v1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let filter='all';function save(){localStorage.setItem(key,JSON.stringify(state))}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let done=items.filter((_,i)=>state[i]?.done).length;document.getElementById('counter').textContent='已掌握 '+done+' / '+items.length+' 项 · 待复习 '+(items.length-done)+' 项';document.getElementById('cards').innerHTML=items.map((a,i)=>{if(filter==='todo'&&state[i]?.done||filter==='done'&&!state[i]?.done)return '';let s=state[i]||{};return '<section class="card"><div class="tag">知识点 '+(i+1)+' / '+items.length+'</div><h2>'+safe(a[0])+'</h2><div class="row"><div class="label">我的原句／回忆</div><div class="wrong">'+safe(a[1])+'</div></div><div class="row"><div class="label">正确表达</div><div class="correct">'+safe(a[2])+'</div></div><div class="row"><div class="label">错在哪里？</div>'+safe(a[3])+'</div><div class="row"><div class="label">需要具体加强的知识</div>'+safe(a[4])+'</div><div class="row"><div class="label">再次练习 · 请先独立说出德语</div><b>'+safe(a[5])+'</b></div><textarea id="input-'+i+'" placeholder="在这里输入自己的德语句子，或先口头回答再核对……">'+safe(s.text||'')+'</textarea><div class="bottom"><button onclick="toggle('+i+')">显示 / 隐藏参考答案</button><button onclick="mark('+i+')">'+(s.done?'✓ 已掌握 · 取消标记':'标记为已掌握')+'</button></div><div class="answer" id="answer-'+i+'">'+safe(a[6])+'</div></section>'}).join('');items.forEach((_,i)=>{let t=document.getElementById('input-'+i);if(t)t.addEventListener('input',()=>{state[i]=state[i]||{};state[i].text=t.value;save()})})}function toggle(i){document.getElementById('answer-'+i).classList.toggle('visible')}function mark(i){state[i]=state[i]||{};state[i].done=!state[i].done;save();render()}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('selected',x===b));render()});render();
</script><script src="deutsch-cloud-sync.js" defer></script></body></html>
