let mediaRecorder, chunks=[], audioCounter=0;

function speak(text){
  if(!("speechSynthesis" in window)){alert("浏览器不支持语音朗读。");return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="de-DE";
  u.rate=parseFloat(document.getElementById("voiceRate").value || "0.9");
  const voices=speechSynthesis.getVoices();
  const de=voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("de"));
  if(de) u.voice=de;
  speechSynthesis.speak(u);
}

async function toggleRecord(btn, boxId){
  if(mediaRecorder && mediaRecorder.state==="recording"){
    mediaRecorder.stop();
    btn.textContent="🎙️ 重新录音";
    return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];
    mediaRecorder=new MediaRecorder(stream);
    mediaRecorder.ondataavailable=e=>chunks.push(e.data);
    mediaRecorder.onstop=()=>{
      const blob=new Blob(chunks,{type:"audio/webm"});
      const url=URL.createObjectURL(blob);
      document.getElementById(boxId).innerHTML=`<audio controls src="${url}"></audio>`;
      stream.getTracks().forEach(t=>t.stop());
    };
    mediaRecorder.start();
    btn.textContent="⏹ 停止录音";
  }catch(e){
    alert("无法开启麦克风。请允许浏览器使用麦克风；录音功能在 HTTPS 或 localhost 下最稳定。");
  }
}

function sentenceCard(de,zh,en,i){
  return `<div class="card">
    <div class="de">${de}</div>
    <div class="zh">${zh}</div>
    <div class="en">${en}</div>
    <div class="actions">
      <button class="speak" onclick='speak(${JSON.stringify(de)})'>🔊 德语发音</button>
      <button class="record" onclick="toggleRecord(this,'rec-${i}')">🎙️ 我的录音</button>
    </div>
    <div id="rec-${i}" class="recbox small">录音会显示在这里。</div>
  </div>`;
}

  if(btn) btn.classList.add("active");
  const l=lessons[key];
  document.getElementById("lessonTitle").textContent=l.title;
  const c=document.getElementById("lessonContent");
  if(l.sentences){
    c.innerHTML=l.sentences.map((x,i)=>sentenceCard(x[0],x[1],x[2],key+"-"+i)).join("");
  } else if(key==="vocab") renderVocab();
  else if(key==="grammar") renderGrammar();
  else if(key==="memorize") renderMemorize();
  else if(key==="mock") renderMock();
}

function renderVocab(){
  document.getElementById("lessonContent").innerHTML=
  `<div class="note">建议每次只背 8–10 个词。不要孤立背词，优先背“词 + 你自己的面试句子”。</div>
   <div class="vocab-grid" style="margin-top:14px">${vocab.map(v=>`<div class="vocab">
   <b>${v[0]}</b><span>${v[1]}</span><div style="margin-top:8px">${v[2]}</div>
   <div class="actions"><button class="speak" onclick='speak(${JSON.stringify(v[0])})'>🔊 词</button><button onclick='speak(${JSON.stringify(v[2])})'>🔊 句子</button></div>
   </div>`).join("")}</div>`;
}

function renderGrammar(){
  document.getElementById("lessonContent").innerHTML=
  `<div class="note">这里不是完整德语语法，而是面试最常用的句法骨架。目标是能快速生成自己的答案。</div>`+
  grammar.map(g=>`<div class="grammar"><b>${g[0]}</b><div class="de" style="font-size:16px;margin-top:6px">${g[1]}</div><div class="zh">${g[2]}</div><div class="actions"><button class="speak" onclick='speak(${JSON.stringify(g[1])})'>🔊 听句子</button></div></div>`).join("");
}

let flashIndex=0;
const flashcards = [
["我先看哪个指标真正反映结果。","Ich schaue zuerst, welche Kennzahl das tatsächliche Ergebnis am besten widerspiegelt."],
["这个数字看起来很好，但它可能高估了真实参与。","Diese Zahl sieht gut aus, könnte aber die tatsächliche Teilnahme überschätzen."],
["我不想用一个新的硬阈值去替代旧的硬阈值。","Ich wollte nicht einen starren Schwellenwert einfach durch einen anderen ersetzen."],
["我把未知状态变成了可行动状态。","Ich habe einen unbekannten Status in einen klaren, handlungsfähigen Status überführt."],
["如果一项任务很紧急但影响较低，我会检查能否委派或自动化。","Wenn eine Aufgabe dringend, aber weniger wichtig ist, prüfe ich, ob sie delegiert oder automatisiert werden kann."],
["我会把结果和过程分开衡量。","Ich messe das Ergebnis getrennt vom Prozess."],
["回头看，我应该更早升级这个风险。","Im Nachhinein hätte ich dieses Risiko früher eskalieren sollen."],
["我会先理解对方为什么不行动。","Ich versuche zuerst zu verstehen, warum die andere Person nicht handelt."]
];

function renderMemorize(){
  const f=flashcards[flashIndex];
  document.getElementById("lessonContent").innerHTML=`<div class="quiz">
    <div class="small">Flashcard ${flashIndex+1}/${flashcards.length}</div>
    <div class="prompt" style="margin-top:10px">${f[0]}</div>
    <div class="actions">
      <button class="primary" onclick="document.getElementById('flashAns').classList.toggle('hidden')">显示德语</button>
      <button onclick="flashIndex=(flashIndex+1)%flashcards.length;renderMemorize()">下一张 →</button>
    </div>
    <div id="flashAns" class="answerbox hidden"><div class="de">${f[1]}</div>
      <div class="actions"><button class="speak" onclick='speak(${JSON.stringify(f[1])})'>🔊 发音</button><button class="record" onclick="toggleRecord(this,'flashRec')">🎙️ 录音</button></div>
      <div id="flashRec" class="recbox small">先自己说，再回放对比。</div>
    </div>
  </div>`;
}

let mockIndex=0;
function renderMock(){
  const q=mockQs[mockIndex];
  document.getElementById("lessonContent").innerHTML=`<div class="quiz">
    <span class="tag orange">${q[1]}</span>
    <div class="prompt" style="margin-top:12px">${q[0]}</div>
    <div class="actions">
      <button class="speak" onclick='speak(${JSON.stringify(q[0])})'>🔊 听问题</button>
      <button class="record" onclick="toggleRecord(this,'mockRec')">🎙️ 录我的回答</button>
      <button onclick="showLesson('${q[2]}')">📚 看相关素材</button>
      <button onclick="mockIndex=(mockIndex+1)%mockQs.length;renderMock()">下一题 →</button>
    </div>
    <div id="mockRec" class="recbox small">建议先用德语回答 30–60 秒。如果卡住，再去相关素材复习。</div>
  </div>`;
}

function startRandom(){
  const keys=["intro","why","data","priority","stakeholder","failure","star"];
  const k=keys[Math.floor(Math.random()*keys.length)];
  showLesson(k);
  const s=lessons[k].sentences[Math.floor(Math.random()*lessons[k].sentences.length)][0];
  setTimeout(()=>speak(s),120);
}
function startMock(){showLesson("mock");}
showLesson("intro",document.querySelector(".lesson-btn"));
</script>
<style>.hidden{display:none}</style>
</body>
