<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article Learning · Thema AI</title>
<style>
:root{--bg:#f6f2ec;--paper:#fffdf9;--ink:#2f3138;--muted:#7a7d87;--line:#e8e0d7;--accent:#7894b8;--soft:#eef4f9;--shadow:0 10px 28px rgba(72,64,57,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.7}
.wrap{max-width:980px;margin:auto;padding:42px 22px 70px}
.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap}
h1{margin:0;font-size:34px}.sub{color:var(--muted);margin-top:6px;max-width:720px}
.back{color:#5f7694;text-decoration:none;font-weight:700}
.section{margin-top:30px}
.section-title{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{display:block;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);transition:.18s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(72,64,57,.11)}
.num{font-size:12px;font-weight:800;color:#5f7694;background:var(--soft);display:inline-block;padding:5px 9px;border-radius:999px;margin-bottom:12px}
.card h2{font-size:21px;margin:0 0 8px}.card p{margin:0;color:var(--muted)}
.flow{font-size:12px;margin-top:14px;color:#5f7694;font-weight:700}
.note{margin-top:18px;background:#fff8e9;border:1px solid #ecd8a8;border-radius:12px;padding:12px 14px;color:#645a49}
@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding-top:28px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Article Learning · Thema AI</h1>
      <div class="sub">每一篇文章都是一个独立学习单元，但都使用同一套学习结构。你可以按文章逐篇复习，不会把所有内容堆在一起。</div>
    </div>
    <a class="back" href="index.html">← 返回 Learning Hub</a>
  </div>

  <div class="section">
    <div class="section-title">Thema AI · Articles</div>
    <div class="grid">
      <a class="card" href="article-ai-01.html">
        <div class="num">ARTICLE 1</div>
        <h2>Künstliche Intelligenz: Fluch oder Segen?</h2>
        <p>从科幻电影中的机器人谈到 AI 的能力、应用、限制、信任问题与未来发展。</p>
        <div class="flow">生词预习 → 表达搭建 → 原文听读 → 回译 → 迁移 → 自由表达 →</div>
      </a>
    </div>
    <div class="note">下一篇文章会作为 <b>Article 2</b> 加在这里，并复制 Article 1 的完整学习结构。</div>
  </div>
</div>
</body>
</html>
